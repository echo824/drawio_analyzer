[project]
name = "oil-fracturing-evaluator"
version = "0.1.0"
description = "油井压裂评价微服务：JSON → 三态规则求值 → Draw.io 结果渲染"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=core --cov=config_loader --cov=app --cov-report=term-missing"

[tool.ruff]
# 120：兼容长签名/黄金快照等可读长行（历史 E501 最长 117，放宽即零改代码通过）
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 类型注解由 mypy（CI 独立步骤）负责，ruff 不再重复强制 ANN；保留风格/正确性类规则
select = ["E", "F", "I", "UP", "B"]
# UP042: 三态/Level 故意用 (str, Enum) mixin 以便 JSON 序列化，不换 StrEnum
# B905 : zip 长度由构造保证，不强制 strict=
ignore = ["UP042", "B905"]

[tool.ruff.lint.per-file-ignores]
# conftest 内 _SYMBOLS_FLOW_XML 是逐字嵌入的 .drawio XML 夹具，长行是数据本体而非代码风格
"tests/conftest.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
