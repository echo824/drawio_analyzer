# parameters.yaml — 油井压裂评价模板参数 Schema
# 权威依据：需求补充（基于真实模板）.md §3
# 说明（A 方案）：调用方按节点 id 传值(node_values)，本文件定义各量的语义/单位/范围，
#   供 rules.yaml 引用与 Validator 校验；量本身归入所属节点，不在此平铺取值。
# 标记约定：TODO 表示需业务确认的默认值/单位/范围。

meta:
  template: oil_fracturing_v1
  version: 1.0.0            # parameters 版本（与模板/规则版本独立）
  well_id_example: W001

# ─────────────────────────────────────────────────────────────
# 1) quantities —— 本井量/派生量/区域基准（语义字典，不含具体值）
#    kind: measurement=本井实测 | derived=本井内派生(服务算) | aggregate=跨井统计(外部传入)
# ─────────────────────────────────────────────────────────────
quantities:
  reservoir_layers:
    kind: measurement
    type: integer
    unit: "层"
    range: [0, 100]          # TODO: 合理范围待业务确认
    description: 可压储层层数
  converted_thickness:
    kind: derived
    type: number
    unit: "m"
    description: 折算厚度 = (砂岩厚度 - 有效厚度)/3 + 有效厚度
    derived_from: [sandstone_thickness, effective_thickness]   # TODO: 确认砂岩/有效厚度是否外部直传
    formula: "(sandstone_thickness - effective_thickness) / 3 + effective_thickness"
  total_connected_thickness:
    kind: measurement
    type: number
    unit: "m"
    description: 全井连通厚度
  water_cut:
    kind: measurement
    type: number
    unit: "%"
    range: [0, 100]
    description: 本井含水率
  oil_diff:
    kind: derived
    type: number
    unit: "t"
    description: 本井初期与目前日产油之差
    derived_from: [initial_oil_daily, current_oil_daily]
    formula: "initial_oil_daily - current_oil_daily"
  initial_oil_daily:
    kind: measurement
    type: number
    unit: "t"
  current_oil_daily:
    kind: measurement
    type: number
    unit: "t"
  liquid_intensity:
    kind: measurement
    type: number
    unit: "t/d.m"
    description: 本井产液强度
  liquid_daily:
    kind: measurement
    type: number
    unit: "t"
    description: 本井日产液
  oil_daily:
    kind: measurement
    type: number
    unit: "t"
    description: 本井日产油
  formation_pressure:
    kind: measurement
    type: number
    unit: "MPa"
    description: 目前地层压力
  flow_pressure:
    kind: measurement
    type: number
    unit: "MPa"
    description: 流压
  inflow_performance:
    kind: measurement
    type: number
    unit: "m"
    description: 动液面
  connected_open_wells:
    kind: measurement
    type: integer
    unit: "口"
    description: 与本井连通水井(井距<x_well_distance)开井数
  injection_completion_rate:
    kind: measurement
    type: number
    unit: "%"
    description: 与本井连通水井配注完成率
  casing_inner_diameter:
    kind: measurement
    type: number
    unit: "mm"
    description: 套管通径(外部套损库结果值传入)
  casing_damage:
    kind: measurement
    type: boolean
    description: 油层深度以上套管是否损坏(不严重=FALSE/严重=TRUE)   # TODO: 确认布尔方向语义

  # —— 区域/井网聚合基准：一律外部传入(§3.3 数据供给原则)，服务不统计 ——
  avg_water_cut:
    kind: aggregate
    type: number
    unit: "%"
    provided_in: basis
    description: 全区平均含水率 或 井网平均含水率(外部算好传入)     # TODO: 确认取全区还是井网
  avg_liquid:
    kind: aggregate
    type: number
    unit: "t"
    provided_in: basis
    description: 全区/井网平均产液量
  avg_oil:
    kind: aggregate
    type: number
    unit: "t"
    provided_in: basis
    description: 全区/井网平均产油量
  neighbor_avg_oil_daily:
    kind: aggregate
    type: number
    unit: "t"
    provided_in: basis
    description: 周围油井产油量平均值
  block_avg_oil_daily:
    kind: aggregate
    type: number
    unit: "t"
    provided_in: basis
    description: 区块平均产油量
  block_avg_pressure:
    kind: aggregate
    type: number
    unit: "MPa"
    provided_in: basis
    description: 区块平均地层压力
  block_avg_flow_pressure:
    kind: aggregate
    type: number
    unit: "MPa"
    provided_in: basis
    description: 区块平均流压
  block_avg_inflow:
    kind: aggregate
    type: number
    unit: "m"
    provided_in: basis
    description: 区块平均动液面

# ─────────────────────────────────────────────────────────────
# 2) thresholds —— 常数阈值（描述内原写死数一律参数化）
#    Y 不在这里：Y 是写死常数，见 rules.yaml P005 表达式
# ─────────────────────────────────────────────────────────────
thresholds:
  x1:  { value: 5,   unit: "m" }    # TODO: 全井连通厚度阈值
  x3:  { value: 3,   unit: "层" }   # 可压储层层数阈值
  x4:  { value: 5,   unit: "m" }    # 折算厚度阈值
  x6:  { value: 10,  unit: "t" }    # TODO: 日产液阈值
  x7:  { value: 0.5, unit: "" }     # TODO: 日产液×全区/井网平均 系数
  x8:  { value: 2,   unit: "t/d.m" }# TODO: 产液强度阈值
  x9:  { value: 0.8, unit: "" }     # TODO: 产液强度×平均 系数
  x10: { value: 3,   unit: "t" }    # TODO: 日产油阈值
  x11: { value: 0.5, unit: "" }     # TODO: 日产油×平均 系数
  x12: { value: 10,  unit: "t" }    # TODO: 初期-目前日产油之差阈值
  x13: { value: 70,  unit: "%" }    # P005 含水率常数阈值(非分段,见需求文档§3.4b)
  x20: { value: 2,   unit: "口" }   # TODO: 连通开井数阈值
  x22: { value: 80,  unit: "%" }    # TODO: 配注完成率阈值
  x_well_distance:   { value: 350, unit: "米" }   # 原 P013 文本内 "井距<350米"
  x_neighbor_factor: { value: 1.5, unit: "" }     # 原 P003 文本内 "*1.5"
  casing_min:        { value: 105, unit: "mm" }   # 原 P016 "通径>105mm"

# ─────────────────────────────────────────────────────────────
# 3) piecewise —— 备用形态，当前模板无节点使用（P005 已改常数比较）
# ─────────────────────────────────────────────────────────────
# piecewise_thresholds: {}   # 保留占位，未来若出现按类别取值的阈值再启用
