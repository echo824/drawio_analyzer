# parameters.yaml — 油井压裂评价模板参数 Schema
# 权威依据：需求补充（基于真实模板）.md §3
# 说明（A 方案）：调用方按节点 id 传值(node_values)，本文件定义各量的语义/单位/范围，
#   供 rules.yaml 引用与 Validator 校验；量本身归入所属节点，不在此平铺取值。
# 标记约定：无服务内计算——所有量(含派生/聚合)均由外部传入，本文件仅定义语义/单位/范围供校验。
#   【待确认项处置(见 待确认项.md)】
#   - B 阈值：均保留占位默认值，与代码解耦——求值只引用符号名，后期改数值只改本文件。
#   - D 派生量/数据来源：converted_thickness、oil_diff 等一律外部直传，本服务不做任何公式派生
#     或统计聚合（对齐 §3 数据供给原则）。
#   - R2 右值全面阈值化(2026-10)：原 basis 聚合基准(avg_*/block_avg_*)退役，各比较式右值
#     收归为单一阈值符号(x_pXXX_*)；具体数值=外部(或上线现场)算好后经 thresholds 传入。

meta:
  template: oil_fracturing_v1
  version: 1.0.0            # parameters 版本（与模板/规则版本独立）
  well_id_example: W001

# ─────────────────────────────────────────────────────────────
# 1) quantities —— 本井量/派生量（语义字典，不含具体值）
#    kind: measurement=本井实测 | aggregate=跨井统计口径(仍由外部按节点直传左值)
# ─────────────────────────────────────────────────────────────
quantities:
  reservoir_layers:
    kind: measurement
    type: integer
    unit: "层"
    range: [0, 100]          # B9：占位合理范围，待业务核实后只改本行（非阻断项）
    description: 可压储层层数
  converted_thickness:
    kind: measurement
    type: number
    unit: "m"
    description: 折算厚度（D1：由外部直传，服务不按公式计算）
    # 语义参考（上游可选算法，本服务不执行）：(砂岩厚度 - 有效厚度)/3 + 有效厚度
  total_connected_thickness:
    kind: measurement
    type: number
    unit: "m"
    description: 全井连通厚度
  water_cut:
    kind: measurement
    type: number
    unit: "%"
    range: [0, 100]
    description: 本井含水率
  oil_diff:
    kind: measurement
    type: number
    unit: "t"
    description: 本井初期与目前日产油之差（D2：差值由外部直传，服务不做减法）
    # 语义参考（上游可选算法，本服务不执行）：initial_oil_daily - current_oil_daily
  initial_oil_daily:
    kind: measurement
    type: number
    unit: "t"
  current_oil_daily:
    kind: measurement
    type: number
    unit: "t"
  liquid_intensity:
    kind: measurement
    type: number
    unit: "t/d.m"
    description: 本井产液强度
  liquid_daily:
    kind: measurement
    type: number
    unit: "t"
    description: 本井日产液
  oil_daily:
    kind: measurement
    type: number
    unit: "t"
    description: 本井日产油
  formation_pressure:
    kind: measurement
    type: number
    unit: "MPa"
    description: 目前地层压力
  flow_pressure:
    kind: measurement
    type: number
    unit: "MPa"
    description: 流压
  inflow_performance:
    kind: measurement
    type: number
    unit: "m"
    description: 动液面
  connected_open_wells:
    kind: measurement
    type: integer
    unit: "口"
    description: 与本井连通水井(井距<x_well_distance)开井数
  injection_completion_rate:
    kind: measurement
    type: number
    unit: "%"
    description: 与本井连通水井配注完成率
  casing_inner_diameter:
    kind: measurement
    type: number
    unit: "mm"
    description: 套管通径(外部套损库结果值传入)
  casing_damage:
    kind: measurement
    type: boolean
    description: 油层深度以上套管是否损坏（不严重=FALSE/严重=TRUE；布尔方向见 rules.yaml P016，值由外部传入）

  # —— P003 左值：周围油井产油量平均值（跨井统计口径由外部算好后按节点直传）——
  neighbor_avg_oil_daily:
    kind: aggregate
    type: number
    unit: "t"
    description: 周围油井产油量平均值（作 P003 比较左值，经 node_values 传入）

# ─────────────────────────────────────────────────────────────
# 2) thresholds —— 右值阈值占位符（描述内原写死数/原表达式一律参数化）
#    【B 处置】以下均为占位默认值，与代码解耦；上线时真实数值经请求 thresholds 覆盖。
#    【R2 右值阈值化】x_pXXX_* 系列为原 expr 表达式(@基准×系数−Y)塌缩后的单值占位符，
#    默认值按旧样例 basis 换算而来（如 x_p005_region=55−8=47），均为占位、待上线时外部给定。
# ─────────────────────────────────────────────────────────────
thresholds:
  x1:  { value: 5,   unit: "m" }    # B1 全井连通厚度阈值（占位 5m，待核实）
  x3:  { value: 3,   unit: "层" }   # 可压储层层数阈值
  x4:  { value: 5,   unit: "m" }    # 折算厚度阈值
  x6:  { value: 10,  unit: "t" }    # B2 日产液阈值（占位 10，待核实）
  x8:  { value: 2,   unit: "t/d.m" }# B3 产液强度阈值（占位 2，待核实）
  x10: { value: 3,   unit: "t" }    # B4 日产油阈值（占位 3，待核实）
  x12: { value: 10,  unit: "t" }    # B5 初期-目前日产油之差阈值（占位 10t）
  x13: { value: 70,  unit: "%" }    # P005 含水率常数阈值(非分段,见需求文档§3.4b)
  x20: { value: 2,   unit: "口" }   # B6 连通开井数阈值（占位 2口）
  x22: { value: 80,  unit: "%" }    # B7 配注完成率阈值（占位 80%）
  casing_min: { value: 105, unit: "mm" }   # 原 P016 "通径>105mm"
  # —— 右值表达式塌缩后的阈值占位符（上线时=外部算好的具体数值）——
  x_p003:          { value: 9,   unit: "t" }     # P003：原 区块平均产油量×1.5（占位 6×1.5）
  x_p005_region:   { value: 47,  unit: "%" }     # P005：原 全区平均含水−Y（占位 55−8）
  x_p005_net:      { value: 45,  unit: "%" }     # P005：原 井网平均含水−Y（占位，待核实）
  x_p007_region:   { value: 1.6, unit: "t/d.m" } # P007：原 x9×全区平均产液强度（占位 0.8×2）
  x_p007_net:      { value: 1.5, unit: "t/d.m" } # P007：原 x9×井网平均（占位，待核实）
  x_p008_region:   { value: 12.5, unit: "t" }    # P008：原 x7×全区平均日产液（占位 0.5×25）
  x_p008_net:      { value: 12,  unit: "t" }     # P008：原 x7×井网平均（占位，待核实）
  x_p009_region:   { value: 3,   unit: "t" }     # P009：原 x11×全区平均日产油（占位 0.5×6）
  x_p009_net:      { value: 2.5, unit: "t" }     # P009：原 x11×井网平均（占位，待核实）
  x_p010_block:    { value: 16,  unit: "MPa" }   # P010：原 区块平均地层压力
  x_p011_flow_block:   { value: 12,  unit: "MPa" } # P011：原 区块平均流压
  x_p011_inflow_block: { value: 600, unit: "m" }   # P011：原 区块平均动液面

# ─────────────────────────────────────────────────────────────
# 3) piecewise —— 备用形态，当前模板无节点使用（P005 已改常数比较）
# ─────────────────────────────────────────────────────────────
# piecewise_thresholds: {}   # 保留占位，未来若出现按类别取值的阈值再启用
