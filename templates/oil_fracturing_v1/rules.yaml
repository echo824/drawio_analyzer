# rules.yaml — 油井压裂评价规则与拓扑
# 权威依据：需求补充（基于真实模板）.md §1/§2/§3.4/§4.6
# 关键约定：
#   - 以业务码(P/R/C编号)为唯一主键，绝不使用 mxCell.id 作锚点(随机 id 不稳定)。
#   - type: predicate(P) | rule(R) | conclusion(C)
#   - predicate: operands[] 各含 name(对应 parameters.yaml quantities) / op / threshold 或 expr；
#                节点内多操作数由 logic 合并(默认 AND)。
#   - rule/conclusion: aggregate(默认 AND) + children[](引用业务码)。
#   - 值回写(§4.6)按 operands[].name 定位到各比较运算符前插入 node_values[节点id].name。
#
# 【待确认项处置(见 待确认项.md)】
#   - A 聚合算子：按当前默认值确定；每个 R/C 均显式声明 aggregate，算子只在本文件配置、
#     求值逻辑不写死，后期改算子仅需改此处 aggregate 字段(与代码解耦)。
#   - B 阈值/常数：数值与写死常数全部外提到 parameters.yaml，本文件只引用符号名。
#   - C 判据操作数/基准：比较左值(实测/派生)与右侧基准(区块/井网/全区平均)一律由外部传入
#     (node_values / basis)；本文件仅声明比较式结构与默认比较方向，不做任何统计计算。

meta:
  template: oil_fracturing_v1
  rules_version: "2026.04"          # 规则版本(与模板版本独立, §8/§9)
  default_aggregate: AND            # 需求 §2.3：全部满足才成立
  evaluation_order: bottom_up       # 自叶节点起沿依赖求值(§2.5)

# ═════════════════════════════════════════════════════════════
# P 节点（叶子判据）—— 由 node_values + thresholds 直接比较
# ═════════════════════════════════════════════════════════════
P001:
  type: predicate
  logic: AND                         # 原文"…且…"
  operands:
    - { name: reservoir_layers,    op: ">", threshold: x3 }
    - { name: converted_thickness, op: ">", threshold: x4 }
P002:
  type: predicate
  operands:
    - { name: total_connected_thickness, op: ">", threshold: x1 }
P003:
  type: predicate
  # 周围油井产油量 > 区块平均产油量 * x_neighbor_factor
  # C1: 比较左值 neighbor_avg_oil_daily 与右侧基准 block_avg_oil_daily 均由外部传入(node_values / basis)
  operands:
    - { name: neighbor_avg_oil_daily, op: ">", expr: "@block_avg_oil_daily * x_neighbor_factor" }
P005:
  type: predicate
  logic: OR                          # 原文"…或…"
  operands:
    - { name: water_cut, op: "<", threshold: x13 }
    # B8: Y 常数不再写死，外提为 parameters.yaml 的 x_p005_y(当前=8)；avg_water_cut 由 basis 外部传入
    - { name: water_cut, op: "<", expr: "@avg_water_cut - x_p005_y" }
P006:
  type: predicate
  operands:
    - { name: oil_diff, op: ">", threshold: x12 }                # oil_diff 为派生量(§3.2)
P007:
  type: predicate
  logic: OR
  operands:
    - { name: liquid_intensity, op: "<", threshold: x8 }
    - { name: liquid_intensity, op: "<", expr: "x9 * @avg_liquid" }
P008:
  type: predicate
  logic: OR
  operands:
    - { name: liquid_daily, op: "<", threshold: x6 }
    - { name: liquid_daily, op: "<", expr: "x7 * @avg_liquid" }
P009:
  type: predicate
  logic: OR
  operands:
    - { name: oil_daily, op: "<", threshold: x10 }
    - { name: oil_daily, op: "<", expr: "x11 * @avg_oil" }       # C4: 基准 avg_oil 外部传入；未另加"周围油井均值"分支（待如需再加）
P010:
  type: predicate
  # C2: 地层压力 > 区块平均地层压力(block_avg_pressure 由 basis 外部传入)
  operands:
    - { name: formation_pressure, op: ">", expr: "@block_avg_pressure" }
P011:
  type: predicate
  logic: OR
  # C3: 流压 < 区块平均流压 或 动液面 > 区块平均动液面；基准均由 basis 外部传入
  operands:
    - { name: flow_pressure,      op: "<", expr: "@block_avg_flow_pressure" }
    - { name: inflow_performance, op: ">", expr: "@block_avg_inflow" }
P013:
  type: predicate
  operands:
    # 与井距过滤(井距<x_well_distance)已隐含在 connected_open_wells 的统计口径里(外部传入即已按井距筛过)
    - { name: connected_open_wells, op: ">", threshold: x20 }
P015:
  type: predicate
  operands:
    - { name: injection_completion_rate, op: ">", threshold: x22 }
P016:
  type: predicate
  logic: AND
  # C5: casing_damage 布尔方向保持当前默认：不严重=FALSE→成立；值由 node_values 外部传入
  operands:
    - { name: casing_inner_diameter, op: ">", threshold: casing_min }
    - { name: casing_damage,         op: "==", value: false }

# ═════════════════════════════════════════════════════════════
# R 节点（中间规则）—— 聚合下游
# ═════════════════════════════════════════════════════════════
R01:
  type: rule
  aggregate: AND                    # 四大子结论全成立 → 具备可压性
  children: [C011, C012, C013, C014]
R02-1:
  type: rule
  aggregate: AND                    # 储层厚度足够 且 含水不高
  children: [C015, C018]
R02-2:
  type: rule
  aggregate: AND                    # A4已确认：保持 AND(C015 且 P003)；如需改 OR 只改本行
  children: [C015, P003]
R03:
  type: rule
  aggregate: AND                    # A2已确认：保持 AND(产液产油能力低 且 压力不匹配 → 低效)
  children: [C019, C020]
R05:
  type: rule
  aggregate: AND                    # 良好连通性 且 充足注水保障
  children: [C022, C023]
R06:
  type: rule
  aggregate: AND                    # P001 且 P002
  children: [P001, P002]
R10:
  type: rule
  aggregate: AND                    # 单子节点：聚合无意义，显式声明供统一管理
  children: [P005]
R11:
  type: rule
  aggregate: OR                     # A1已确认：保持 OR(任一低即低效)；如需改 AND 只改本行
  children: [P006, P007, P008, P009]
R12-1:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P010]
R12-2:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P011]
R14:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P013]
R15:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P015]
R19:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P016]

# ═════════════════════════════════════════════════════════════
# C 节点（结论）—— 聚合上游; 根结论为 C001
# ═════════════════════════════════════════════════════════════
C001:
  type: conclusion
  aggregate: AND
  children: [R01]
  is_root: true
C011:
  type: conclusion
  aggregate: AND                    # 有油潜力: R02-1 且 R02-2
  children: [R02-1, R02-2]
C012:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R03]
C013:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R19]
C014:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R05]
C015:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R06]
C018:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R10]
C019:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R11]
C020:
  type: conclusion
  aggregate: OR                     # A3已确认：保持 OR(R12-1 或 R12-2 任一)；如需改 AND 只改本行
  children: [R12-1, R12-2]
C022:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R14]
C023:
  type: conclusion
  aggregate: AND                    # 单子节点
  children: [R15]

# ═════════════════════════════════════════════════════════════
# 附：拓扑速览（自底向上 P→R→C→根，供校验/追溯参考，不参与执行）
# ═════════════════════════════════════════════════════════════
# C001 ← R01 ← {C011, C012, C013, C014}
#   C011 ← {R02-1 ← [C015 ← R06 ← (P001,P002)], [C018 ← R10 ← P005]},
#          {R02-2 ← [C015], P003}
#   C012 ← R03 ← {C019 ← R11 ← (P006,P007,P008,P009)},
#                {C020 ← R12-1 ← P010 ; R12-2 ← P011}
#   C013 ← R19 ← P016
#   C014 ← R05 ← {C022 ← R14 ← P013}, {C023 ← R15 ← P015}
