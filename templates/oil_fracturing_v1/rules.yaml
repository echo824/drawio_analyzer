# rules.yaml — 油井压裂评价规则与拓扑
# 权威依据：需求补充（基于真实模板）.md §1/§2/§3.4/§4.6
# 关键约定：
#   - 以业务码(P/R/C编号)为唯一主键，绝不使用 mxCell.id 作锚点(随机 id 不稳定)。
#   - type: predicate(P) | rule(R) | conclusion(C)
#   - predicate: operands[] 各含 name(对应 parameters.yaml quantities) / op / threshold 或 value(字面量)；
#                节点内多操作数由 logic 合并(默认 AND)。
#   - rule/conclusion: aggregate + children[](引用业务码)。
#     业务规则(2026-10-05 确认)：**所有 R(关系)节点来源一律 AND；所有 C(结论)节点来源一律 OR**；
#     仍在每个 R/C 显式声明 aggregate 以便逐点审查，后期调整只改本文件。
#   - 右值全部阈值化(2026-10 需求更新)：每个比较式的右值都是单一阈值占位符(threshold 符号)，
#     其具体数值由外部算好后经 thresholds 传入；服务内不做任何表达式/@引用运算。
#     渲染时把描述中的占位符替换为具体数值，括号（…）内的解释文字不做处理。
#
# 【待确认项处置(见 待确认项.md)】
#   - A 聚合算子：按本文件头业务规则定档（R=AND / C=OR，2026-10-05 确认，覆盖旧 A1-A4 逐项默认）；
#     算子只在本文件配置、求值逻辑不写死，后期改算子仅需改此处 aggregate 字段(与代码解耦)。
#   - B 阈值/常数：数值与写死常数全部外提到 parameters.yaml，本文件只引用符号名。
#   - C 判据操作数/基准：比较左值(实测/派生)由 node_values 传入；右侧基准(区块/井网/全区平均)
#     整体阈值化为 threshold 占位符(上线时=外部算好的具体数值)，本文件仅声明比较式结构与比较方向。

meta:
  template: oil_fracturing_v1
  rules_version: "2026.04"          # 规则版本(与模板版本独立, §8/§9)
  default_aggregate: AND            # 未声明时的默认：P 节点 logic 默认 AND；R/C 均已显式声明(R=AND/C=OR)
  evaluation_order: bottom_up       # 自叶节点起沿依赖求值(§2.5)

# ═════════════════════════════════════════════════════════════
# P 节点（叶子判据）—— 由 node_values + thresholds 直接比较
# ═════════════════════════════════════════════════════════════
P001:
  type: predicate
  logic: AND                         # 原文"…且…"
  operands:
    - { name: reservoir_layers,    op: ">", threshold: x3 }
    - { name: converted_thickness, op: ">", threshold: x4 }
P002:
  type: predicate
  operands:
    - { name: total_connected_thickness, op: ">", threshold: x1 }
P003:
  type: predicate
  # 周围油井产油量 > x_p003（= 区块平均产油量×系数，右值整体阈值化，外部算好传入）
  operands:
    - { name: neighbor_avg_oil_daily, op: ">", threshold: x_p003 }
P005:
  type: predicate
  logic: OR                          # 原文"…或…"
  # 右值全部阈值化：常数阈值 + 全区基准(x13-系列) + 井网基准，各为外部算好的单值
  operands:
    - { name: water_cut, op: "<", threshold: x13 }
    - { name: water_cut, op: "<", threshold: x_p005_region }
    - { name: water_cut, op: "<", threshold: x_p005_net }
P006:
  type: predicate
  operands:
    - { name: oil_diff, op: ">", threshold: x12 }                # oil_diff 为派生量(§3.2)
P007:
  type: predicate
  logic: OR
  # 平均基准分支已阈值化：x_p007_region / x_p007_net = 系数×全区(井网)平均，外部算好传入
  operands:
    - { name: liquid_intensity, op: "<", threshold: x8 }
    - { name: liquid_intensity, op: "<", threshold: x_p007_region }
    - { name: liquid_intensity, op: "<", threshold: x_p007_net }
P008:
  type: predicate
  logic: OR
  operands:
    - { name: liquid_daily, op: "<", threshold: x6 }
    - { name: liquid_daily, op: "<", threshold: x_p008_region }
    - { name: liquid_daily, op: "<", threshold: x_p008_net }
P009:
  type: predicate
  logic: OR
  # C4: 基准分支阈值化，外部传入具体数值；未另加"周围油井均值"分支（已确认不新增）
  operands:
    - { name: oil_daily, op: "<", threshold: x10 }
    - { name: oil_daily, op: "<", threshold: x_p009_region }
    - { name: oil_daily, op: "<", threshold: x_p009_net }
P010:
  type: predicate
  # C2: 地层压力 > x_p010_block（区块平均压力，右值阈值化，外部传入具体数值）
  operands:
    - { name: formation_pressure, op: ">", threshold: x_p010_block }
P011:
  type: predicate
  logic: OR
  # C3: 流压 < x_p011_flow_block 或 动液面 > x_p011_inflow_block（区块基准阈值化，外部传入）
  operands:
    - { name: flow_pressure,      op: "<", threshold: x_p011_flow_block }
    - { name: inflow_performance, op: ">", threshold: x_p011_inflow_block }
P012:
  type: predicate
  # 1005 版接入："动液面大于区块平均值"——独立参与 C020（经 R12-3）；左值与 P011 第二分支同量
  operands:
    - { name: inflow_performance, op: ">", threshold: x_p012_block }
P013:
  type: predicate
  operands:
    # 与井距过滤(井距<x_well_distance)已隐含在 connected_open_wells 的统计口径里(外部传入即已按井距筛过)
    - { name: connected_open_wells, op: ">", threshold: x20 }
P015:
  type: predicate
  operands:
    - { name: injection_completion_rate, op: ">", threshold: x22 }
P016:
  type: predicate
  logic: AND
  # C5: casing_damage 布尔方向保持当前默认：不严重=FALSE→成立；值由 node_values 外部传入
  operands:
    - { name: casing_inner_diameter, op: ">", threshold: casing_min }
    - { name: casing_damage,         op: "==", value: false }

# ═════════════════════════════════════════════════════════════
# R 节点（中间规则）—— 聚合下游
# ═════════════════════════════════════════════════════════════
R01:
  type: rule
  aggregate: AND                    # 四大子结论全成立 → 具备可压性
  children: [C011, C012, C013, C014]
R02-1:
  type: rule
  aggregate: AND                    # 储层厚度足够 且 含水不高
  children: [C015, C018]
R02-2:
  type: rule
  aggregate: AND                    # A4已确认：保持 AND(C015 且 P003)；如需改 OR 只改本行
  children: [C015, P003]
R03:
  type: rule
  aggregate: AND                    # A2已确认：保持 AND(产液产油能力低 且 压力不匹配 → 低效)
  children: [C019, C020]
R05:
  type: rule
  aggregate: AND                    # 良好连通性 且 充足注水保障
  children: [C022, C023]
R06:
  type: rule
  aggregate: AND                    # P001 且 P002
  children: [P001, P002]
R10:
  type: rule
  aggregate: AND                    # 单子节点：聚合无意义，显式声明供统一管理
  children: [P005]
R11:
  type: rule
  aggregate: AND                    # 新规则：R 节点来源一律 AND(四项产低同时成立)；覆盖旧 A1 的 OR 默认
  children: [P006, P007, P008, P009]
R12-1:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P010]
R12-2:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P011]
R12-3:
  type: rule
  aggregate: AND                    # 单子节点；1005 版新增（注水不足分支）
  children: [P012]
R14:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P013]
R15:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P015]
R19:
  type: rule
  aggregate: AND                    # 单子节点
  children: [P016]

# ═════════════════════════════════════════════════════════════
# C 节点（结论）—— 聚合上游; 根结论为 C001
# 新规则(2026-10-05)：C 节点来源一律 OR（任一上游分支成立即成立）
# ═════════════════════════════════════════════════════════════
C001:
  type: conclusion
  aggregate: OR                     # C 节点来源一律 OR（单子节点时等价透传）
  children: [R01]
  is_root: true
C011:
  type: conclusion
  aggregate: OR                     # 有油潜力: R02-1 或 R02-2 任一成立
  children: [R02-1, R02-2]
C012:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R03]
C013:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R19]
C014:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R05]
C015:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R06]
C018:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R10]
C019:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R11]
C020:
  type: conclusion
  aggregate: OR                     # 新规则下仍为 OR(三支任一)；1005 版增 R12-3
  children: [R12-1, R12-2, R12-3]
C022:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R14]
C023:
  type: conclusion
  aggregate: OR                     # 单子节点
  children: [R15]

# ═════════════════════════════════════════════════════════════
# 附：拓扑速览（自底向上 P→R→C→根，供校验/追溯参考，不参与执行）
# ═════════════════════════════════════════════════════════════
# C001 ← R01 ← {C011, C012, C013, C014}
#   C011 ← {R02-1 ← [C015 ← R06 ← (P001,P002)], [C018 ← R10 ← P005]},
#          {R02-2 ← [C015], P003}
#   C012 ← R03 ← {C019 ← R11 ← (P006,P007,P008,P009)},
#                {C020 ← R12-1 ← P010 ; R12-2 ← P011 ; R12-3 ← P012}
#   C013 ← R19 ← P016
#   C014 ← R05 ← {C022 ← R14 ← P013}, {C023 ← R15 ← P015}
