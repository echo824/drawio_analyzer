# style.yaml — 结果样式与阈值占位符替换格式
# 权威依据：需求补充（基于真实模板）.md §4
# 决策：结果用 fillColor 表达(绿/红/黄)，类型不再依赖颜色、由业务码前缀识别；原始 .drawio 只读。
# 【E 处置】以下均为当前确认策略，保留不变：色值 E1、UNKNOWN 占位 E3(默认不显示)、
#   角标开关 E4(默认关闭)；【2026-10 恢复】实测值回写标注（§4.6 value_annotation）与
#   阈值占位符替换（§6.6 threshold_substitution）共存：先把符号换成阈值数值，再把传入的
#   实测值以全角（值）插到对应运算符前；数值格式约定 number_format: raw 两处共用。

meta:
  template: oil_fracturing_v1
  version: 1.0.0

# ── 1) 结果配色（仅替换 fillColor，其余 style 键原样保留）──
# 注：TRUE/FALSE/UNKNOWN 必须加引号，否则 PyYAML 会把裸 TRUE/FALSE 解析为布尔键。
result_style:
  channel: fill
  color_kinds: [P, C]                # 仅对 P(输入)/C(结论)施加结果色；R(关系/中间规则)保持模板原样
  "TRUE":    { fillColor: "#00B050" }     # 成立=绿
  "FALSE":   { fillColor: "#FF0000" }     # 不成立=红
  "UNKNOWN": { fillColor: "#FFFF00" }     # 条件缺失=饱和黄(区别模板淡黄 P)

# ── 2) 模板原始底色（仅供"未求值节点透传"参考，运行时不覆盖、不参与类型识别）──
template_default_fill:
  P: "#FFFFCC"
  R: "#CCFFFF"
  C: "#FFCCFF"

# ── 3) 未涉及节点：完全不改动（保持原色/文字/连线/字体）──
untouched_nodes:
  types: [edge, unclassified, container, text]   # 连线、说明文字、分组等
  action: passthrough

# ── 4) 可选角标（默认关闭；如需在颜色外再强化结果）──
badge:
  enabled: false                        # E4：角标默认关闭（当前策略）；如需启用改本行
  anchor_prefix: "__badge__"          # 角标节点 id 前缀，热加载时先清理再重建
  symbols: { "TRUE": "✔", "FALSE": "✘", "UNKNOWN": "?" }

# ── 5) 阈值占位符替换（§6.6 改版·2026-10 右值全面阈值化）：
#      P 节点描述中的阈值符号(x13/x_p005_region…) → 具体数值(经请求 thresholds 传入) ──
threshold_substitution:
  enabled: true
  scope: predicate_only                # 仅输入节点(P)描述参与替换；R/C 透传
  skip_brackets: ["（）", "()"]        # 括号内为解释性文字，绝不替换（如 P013 的“（井距<350米）”）
  number_format: raw                   # 按传入原样，整数值浮点去小数点（12.0→12）
  undefined: keep                      # 未取值的符号(None/不在符号表)原样保留；后期模板直写数字自然无匹配
  idempotent: true                     # 替换后不再含符号 → 天然幂等，重复渲染不叠加
  preserve_rich_text: true             # 不破坏 html 实体 / <div>

# ── 5b) 参数值回写标注（§4.6，与 §6.6 阈值替换共存）：
#      把 node_values 传入的实测值以全角（值）插到该量对应比较运算符之前 ──
#   例：P009 传入 oil_daily=2 → “P009 本井日产油（2） &lt; 3 t”。
#   命名绑定：按 rules.yaml 去重后的操作数各插一次；仅输入 P 节点回写，R/C 透传。
#   幂等；只作用内存/输出，原始 .drawio 只读。
value_annotation:
  enabled: true
  brackets: ["（", "）"]                # 全角括号包裹实测值
  bool_true: 是                         # 布尔 True → （是）
  bool_false: 否                        # 布尔 False → （否）
  unknown: ""                           # 缺失/UNKNOWN 量：默认空串 → 不注入（可配“（—）”）
  number_format: raw                    # 与阈值替换一致：整数值浮点去小数点
  anchor_ops: [entities, chinese]       # 运算符锚点仅认实体(&lt;/&gt;…)与中文词(大于/小于…)，绝不认裸 </>（防误伤标签）

# ── 6) 输出渲染 ──
output:
  format: html                         # 主输出(内嵌 draw.io 官方 viewer)   # §12 预留 svg
  viewer: drawio                       # 由 draw.io graphViewer 承载,保布局/连线/字体
